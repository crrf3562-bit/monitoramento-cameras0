<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORAMENTO DE CÂMERAS TI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #0f0a0a;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #8090a6, #404555);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a20d26;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title {
            font-size: 2rem;
            font-weight: 600;
            color: #040303;
            letter-spacing: 1px;
        }

        .header-right {
            text-align: right;
        }

        .github-link {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.9rem;
            color: #ffffff;
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        .github-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .header-date {
            font-size: 3.2rem;
            font-weight: bold;
            color: #060404;
        }

        .header-time {
            font-size: 3.2rem;
            font-weight: bold;
            color: #0b0a0a;
        }

        /* Status Bar */
        .status-bar {
            background-color: #16213e;
            padding: 12px 30px;
            display: flex;
            justify-content: center;
            gap: 50px;
            border-bottom: 1px solid #0f3460;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }

        .status-item .label {
            color: #a8d8ea;
        }

        .status-item .value {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-item.total .value { color: #ffffff; }
        .status-item.online .value { color: #00e676; }
        .status-item.offline .value { color: #e94560; }

        /* Controls */
        .controls {
            background-color: #16213e;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background-color: #d63851;
        }

        .btn-secondary {
            background-color: #0f3460;
            color: #a8d8ea;
            border: 1px solid #0f3460;
        }

        .btn-secondary:hover {
            background-color: #1a4a7a;
        }

        .btn-danger {
            background-color: #c62828;
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .btn-danger:hover {
            background-color: #b71c1c;
        }

        .search-box input {
            padding: 8px 14px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background-color: #1a1a2e;
            color: white;
            font-size: 0.9rem;
            width: 250px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #e94560;
        }

        /* Main Content */
        .main-content {
            padding: 25px 30px;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }

        /* Camera Card */
        .camera-card {
            background: linear-gradient(145deg, #1e2a4a, #16213e);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }

        .camera-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.15);
            border-color: #e94560;
        }

        .camera-card.online { border-left: 4px solid #00e676; }
        .camera-card.offline { border-left: 4px solid #e94560; opacity: 0.85; }

        .camera-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .camera-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .camera-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .camera-status.online { background-color: rgba(0, 230, 118, 0.15); color: #00e676; }
        .camera-status.offline { background-color: rgba(233, 69, 96, 0.15); color: #e94560; }

        .camera-details { margin-top: 10px; }

        .camera-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(15, 52, 96, 0.5);
        }

        .camera-detail-row:last-child { border-bottom: none; }

        .detail-label { color: #a8d8ea; font-size: 0.85rem; }
        .detail-value { color: #ffffff; font-size: 0.85rem; font-weight: 500; text-align: right; }
        .detail-value.ip { font-family: 'Courier New', monospace; color: #ffd54f; }

        .indicator { font-size: 1.4rem; font-weight: bold; }
        .indicator.ok { color: #00e676; }
        .indicator.fail { color: #e94560; }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .pulse-dot.online { background-color: #00e676; animation: pulse 2s infinite; }
        .pulse-dot.offline { background-color: #e94560; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        /* Modal Correção */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background-color: #16213e;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #0f3460;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #a8d8ea;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            background-color: #1a1a2e;
            border: 1px solid #0f3460;
            color: white;
            border-radius: 5px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="AFM00.png" alt="">
            <div class="header-title">BEM-VINDO AO MONITORAMENTO DE CÂMERAS TI</div>
        </div>
        <div class="header-right">
            <div class="header-date" id="headerDate"></div>
            <div class="header-time" id="headerTime"></div>
            <a class="github-link" href="https://github.com/crrf3562-bit/monitoramento-cameras0" target="_blank"></a>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item total">
            <span class="label">Total:</span>
            <span class="value" id="totalCameras">0 câmeras</span>
        </div>
        <div class="status-item online">
            <span class="label">Online:</span>
            <span class="value" id="onlineCount">0</span>
        </div>
        <div class="status-item offline">
            <span class="label">Offline:</span>
            <span class="value" id="offlineCount">0</span>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nome ou IP (172.16.8...)" oninput="filterCameras()">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" onclick="refreshAll()">⟳ Atualizar</button>
            <button class="btn btn-primary" onclick="openModal()">+ Adicionar Câmera</button>
        </div>
    </div>

    <div class="main-content">
        <div class="camera-grid" id="cameraGrid"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Adicionar Câmera</h2>
            <form id="cameraForm" onsubmit="addCamera(); return false;">
                <div class="form-group">
                    <label for="camName">Nome da Câmera</label>
                    <input type="text" id="camName" placeholder="Ex: Câmera Entrada" required>
                </div>
                <div class="form-group">
                    <label for="camIP">Endereço IP</label>
                    <input type="text" id="camIP" value="172.16.8." placeholder="Ex: 172.16.8.15" required>
                </div>
                <div class="form-group">
                    <label for="camLocation">Localização</label>
                    <input type="text" id="camLocation" placeholder="Ex: Recepção">
                </div>
                <div class="form-group">
                    <label for="camType">Tipo</label>
                    <select id="camType">
                        <option value="IP">IP</option>
                        <option value="Analógica">Analógica</option>
                        <option value="PTZ">PTZ</option>
                        <option value="Fisheye">Fisheye</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="camBrand">Marca</label>
                    <input type="text" id="camBrand" placeholder="Ex: Intelbras, Hikvision">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Dados iniciais com IPs estruturados na faixa 172.16.8.x
        const defaultCameras = [
            { id: 1, name: "Acabamento 1", ip: "172.16.8.10", location: "Setor de Produção", type: "IP", brand: "Intelbras", status: "online", lastCheck: "04/08/2026 14:30:00" },
            { id: 2, name: "Forno Acabamento", ip: "172.16.8.11", location: "Área de Fornos", type: "IP", brand: "Intelbras", status: "online", lastCheck: "04/08/2026 14:30:00" },
            { id: 3, name: "Câmera Corredor Norte", ip: "172.16.8.12", location: "1º Andar", type: "PTZ", brand: "Hikvision", status: "offline", lastCheck: "04/08/2026 14:25:00" },
            { id: 4, name: "Câmera Depósito", ip: "172.16.8.15", location: "Depósito - Térreo", type: "Analógica", brand: "Intelbras", status: "online", lastCheck: "04/08/2026 14:30:00" },
            { id: 5, name: "Câmera Portaria 2", ip: "172.16.8.20", location: "Portaria Lateral", type: "IP", brand: "Dahua", status: "offline", lastCheck: "04/08/2026 14:20:00" },
            { id: 6, name: "Câmera Área de Cargas", ip: "172.16.8.25", location: "Doca", type: "Fisheye", brand: "Hikvision", status: "online", lastCheck: "04/08/2026 14:30:00" }
        ];

        let cameras = loadCameras();
        let nextId = cameras.reduce((max, cam) => Math.max(max, cam.id), 0) + 1;

        function saveCameras() {
            localStorage.setItem('camera-monitor-data', JSON.stringify(cameras));
        }

        function loadCameras() {
            const stored = localStorage.getItem('camera-monitor-data');
            if (!stored) return defaultCameras.slice();
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) return parsed;
            } catch (e) {
                console.warn('Erro ao carregar dados salvos.');
            }
            return defaultCameras.slice();
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('headerDate').textContent = now.toLocaleDateString('pt-BR');
            document.getElementById('headerTime').textContent = now.toLocaleTimeString('pt-BR');
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function renderCameras(filteredCameras = null) {
            const grid = document.getElementById('cameraGrid');
            const list = filteredCameras || cameras;
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#a8d8ea; grid-column:1/-1; padding:40px;">Nenhuma câmera encontrada.</p>';
                return;
            }

            list.forEach(cam => {
                const statusClass = cam.status;
                const statusText = cam.status === 'online' ? 'ONLINE' : 'OFFLINE';
                const indicator = cam.status === 'online' ? '<span class="indicator ok">✓</span>' : '<span class="indicator fail">✗</span>';
                const dotClass = cam.status === 'online' ? 'online' : 'offline';

                const card = document.createElement('div');
                card.className = `camera-card ${statusClass}`;
                card.innerHTML = `
                    <div class="camera-header">
                        <span class="camera-name">${cam.name}</span>
                        <span class="camera-status ${statusClass}">
                            <span class="pulse-dot ${dotClass}"></span>
                            ${statusText}
                        </span>
                    </div>
                    <div class="camera-details">
                        <div class="camera-detail-row">
                            <span class="detail-label">IP</span>
                            <span class="detail-value ip">${cam.ip}</span>
                        </div>
                        <div class="camera-detail-row">
                            <span class="detail-label">Localização</span>
                            <span class="detail-value">${cam.location}</span>
                        </div>
                        <div class="camera-detail-row">
                            <span class="detail-label">Tipo</span>
                            <span class="detail-value">${cam.type}</span>
                        </div>
                        <div class="camera-detail-row">
                            <span class="detail-label">Marca</span>
                            <span class="detail-value">${cam.brand}</span>
                        </div>
                        <div class="camera-detail-row">
                            <span class="detail-label">Último Check</span>
                            <span class="detail-value">${cam.lastCheck}</span>
                        </div>
                        <div class="camera-detail-row" style="margin-top: 8px;">
                            <button class="btn btn-danger" onclick="deleteCamera(${cam.id})">Excluir</button>
                            <span class="detail-value">${indicator}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateCounters();
        }

        function updateCounters() {
            document.getElementById('totalCameras').textContent = `${cameras.length} câmeras`;
            document.getElementById('onlineCount').textContent = cameras.filter(c => c.status === 'online').length;
            document.getElementById('offlineCount').textContent = cameras.filter(c => c.status === 'offline').length;
        }

        function filterCameras() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                renderCameras();
                return;
            }
            const filtered = cameras.filter(cam => 
                cam.name.toLowerCase().includes(query) || 
                cam.ip.includes(query) ||
                cam.location.toLowerCase().includes(query)
            );
            renderCameras(filtered);
        }

        function refreshAll() {
            cameras.forEach(cam => {
                cam.status = Math.random() > 0.2 ? 'online' : 'offline';
                const now = new Date();
                cam.lastCheck = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR');
            });
            renderCameras();
            saveCameras();
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('cameraForm').reset();
            document.getElementById('camIP').value = '172.16.8.';
        }

        function addCamera() {
            const name = document.getElementById('camName').value.trim();
            const ip = document.getElementById('camIP').value.trim();
            const location = document.getElementById('camLocation').value.trim();
            const type = document.getElementById('camType').value;
            const brand = document.getElementById('camBrand').value.trim();

            if (!name || !ip) return;

            const now = new Date();
            cameras.push({
                id: nextId++,
                name,
                ip,
                location: location || 'Não informado',
                type,
                brand: brand || 'Não informado',
                status: 'online',
                lastCheck: now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR')
            });

            closeModal();
            renderCameras();
            saveCameras();
        }

        function deleteCamera(id) {
            if (confirm('Deseja realmente remover esta câmera?')) {
                cameras = cameras.filter(cam => cam.id !== id);
                renderCameras();
                saveCameras();
            }
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        renderCameras();
    </script>
</body>
</html>
